<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetroHub | Advanced Supply Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090a0f;
            --bg-panel: rgba(18, 20, 28, 0.6);
            --border-glow: rgba(56, 189, 248, 0.15);
            --accent-primary: #0ea5e9;
            --accent-hover: #0284c7;
            --accent-success: #10b981;
            --accent-warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(14, 165, 233, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .logo-wrap {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Search Section */
        .search-module {
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 2.5rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .search-title {
            font-size: 1.4rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-main);
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        input, select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 1.2rem;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
            background: rgba(0, 0, 0, 0.5);
        }

        button.btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            letter-spacing: 0.5px;
        }

        button.btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.5);
        }

        button.btn-primary:active {
            transform: translateY(1px);
        }

        /* Results Status */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1rem;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .status-metric {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
        }

        .status-metric span.highlight {
            color: var(--accent-primary);
            font-weight: 600;
            font-size: 1.2rem;
        }

        /* Results Grid */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 2rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: rgba(14, 165, 233, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 20px rgba(14, 165, 233, 0.1);
        }

        .card:hover::before {
            opacity: 1;
        }

        /* Card Content Hierarchy */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .product-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: white;
            line-height: 1.2;
            margin-bottom: 0.25rem;
        }

        .product-category {
            font-size: 0.85rem;
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            display: inline-block;
            background: rgba(14, 165, 233, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
        }

        .price-tag {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent-success);
            text-align: right;
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .specs-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            background: rgba(0,0,0,0.2);
            padding: 1rem;
            border-radius: 10px;
            border-left: 3px solid rgba(255,255,255,0.1);
        }

        .vendor-section {
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .vendor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .vendor-name {
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .vendor-location {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .metrics-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .metric-badge {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .metric-badge.trust {
            border-color: rgba(56, 189, 248, 0.3);
            color: #38bdf8;
        }

        .metric-badge.sales {
            color: var(--accent-warning);
        }

        .partnerships {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .partner-tag {
            background: rgba(255,255,255,0.05);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .loader {
            display: none;
            text-align: center;
            padding: 3rem;
            color: var(--accent-primary);
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .loader.active {
            display: block;
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.5; transform: scale(0.98); }
        }

        @media (max-width: 768px) {
            .results-grid { grid-template-columns: 1fr; }
            .card { padding: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <header>
            <div class="logo-wrap">
                <div class="logo-icon">▲</div>
                <div>
                    <h1>PetroHub</h1>
                    <div class="subtitle">Autonomous Intelligence</div>
                </div>
            </div>
            <div>
                <span style="color:var(--text-muted); font-size:0.9rem;">Intelligence Engine: <span style="color:var(--accent-success);">Online</span></span>
            </div>
        </header>

        <section class="search-module">
            <div class="search-title">
                <span style="color: var(--accent-primary);">⌖</span> Supply Network Query
            </div>
            
            <div class="controls-grid">
                <div class="input-group">
                    <label>Resource Keyword</label>
                    <input type="text" id="query" placeholder="e.g. Casing Pipe, ESP, Mud">
                </div>
                
                <div class="input-group">
                    <label>Category Filter</label>
                    <select id="category">
                        <option value="">All Categories</option>
                        <option value="Well Construction">Well Construction</option>
                        <option value="Drilling Equipment">Drilling Equipment</option>
                        <option value="Production Equipment">Production Equipment</option>
                        <option value="Drilling Fluids">Drilling Fluids</option>
                        <option value="Well Control">Well Control</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>Max Budget Cap (USD)</label>
                    <input type="number" id="budget" placeholder="e.g. 500100" min="0">
                </div>
                
                <div class="input-group" style="justify-content: flex-end;">
                    <button class="btn-primary" onclick="executeSearch()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                        Execute Scan
                    </button>
                </div>
            </div>
        </section>

        <div class="status-bar" id="statusBar" style="display: none;">
            <div class="status-metric">Identified <span class="highlight" id="resCount">0</span> resources</div>
            <div class="status-metric" style="color: var(--text-muted); font-size: 0.85rem;">Sorted by Vendor Trust Score Index</div>
        </div>

        <div id="loader" class="loader">
            Synthesizing Network Data...
        </div>

        <div class="results-grid" id="resultsGrid">
            <!-- Results injected here -->
        </div>

    </div>

    <script>
        // Init database on first load simply to ensure it's seeded
        fetch('http://localhost:5001/api/init', { method: 'POST' }).catch(e => console.log('Init check...'));

        async function executeSearch() {
            const query = document.getElementById('query').value;
            const category = document.getElementById('category').value;
            const budgetVal = document.getElementById('budget').value;
            
            const payload = {
                query: query,
                category: category,
                budget: budgetVal ? parseFloat(budgetVal) : null
            };

            const grid = document.getElementById('resultsGrid');
            const loader = document.getElementById('loader');
            const statusBar = document.getElementById('statusBar');
            
            grid.innerHTML = '';
            statusBar.style.display = 'none';
            loader.classList.add('active');

            try {
                const response = await fetch('http://localhost:5001/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                loader.classList.remove('active');
                
                if (data.results && data.results.length > 0) {
                    statusBar.style.display = 'flex';
                    document.getElementById('resCount').textContent = data.count;
                    renderResults(data.results);
                } else {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-muted); font-size: 1.2rem;">No logistics matched the required parameters. Maintain budget or broaden search vector.</div>';
                }
            } catch (err) {
                console.error(err);
                loader.classList.remove('active');
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: #ef4444; font-size: 1.2rem;">Backend Server Not Found. Ensure Flask is running on port 5001.</div>';
            }
        }

        function renderResults(results) {
            const grid = document.getElementById('resultsGrid');
            
            results.forEach((item, index) => {
                const product = item.product;
                const vendor = item.vendor;
                
                // Format price concisely
                const pMin = product.price_min >= 1000 ? (product.price_min/1000).toFixed(1) + 'k' : product.price_min;
                const pMax = product.price_max >= 1000 ? (product.price_max/1000).toFixed(1) + 'k' : product.price_max;
                
                // Build partnerships HTML
                let partnersHtml = '';
                if(vendor.partnerships && vendor.partnerships.length > 0) {
                    partnersHtml = `<div class="partnerships">
                        <span>Trusted by:</span>
                        ${vendor.partnerships.map(p => `<span class="partner-tag">${p}</span>`).join('')}
                    </div>`;
                } else {
                    partnersHtml = `<div class="partnerships" style="color: rgba(255,255,255,0.2);">No major partnerships verified</div>`;
                }

                // Append card
                grid.innerHTML += `
                    <div class="card" style="animation: pulse 0.5s ${index * 0.1}s backwards ease-out;">
                        <div class="card-header">
                            <div>
                                <div class="product-category">${product.category}</div>
                                <h3 class="product-title">${product.name}</h3>
                            </div>
                            <div class="price-tag">$${pMin}</div>
                        </div>
                        
                        <div class="specs-text">
                            ${product.specifications}
                        </div>
                        
                        <div class="vendor-section">
                            <div class="vendor-header">
                                <div class="vendor-name">🏢 ${vendor.name}</div>
                                <div class="vendor-location">📍 ${vendor.location}</div>
                            </div>
                            
                            <div class="metrics-row">
                                <div class="metric-badge trust">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                                    Trust Score: ${vendor.trust_score.toFixed(1)}/100
                                </div>
                                <div class="metric-badge sales">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                                    Sales Vol: ${vendor.total_sales_volume}k
                                </div>
                                <div class="metric-badge" style="color:#a8a29e;">
                                    ⭐ ${vendor.rating.toFixed(1)} Rating
                                </div>
                            </div>
                            
                            ${partnersHtml}
                        </div>
                    </div>
                `;
            });
        }
        
        // Listen for Enter key
        document.addEventListener('keypress', function(e) {
            if(e.key === 'Enter') {
                executeSearch();
            }
        });
    </script>
</body>
</html>
